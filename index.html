
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10091d">
<title>BRAVE TOWN STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#10091d;color:#fff;font-family:Cairo,sans-serif}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#26103e,#10091d);border-bottom:1px solid #9147ff}
header h1{color:#c39aff;margin:0;font-size:27px}
header p{color:#c8b5df;margin:5px}
.container{max-width:1050px;margin:30px auto;padding:15px}
.welcome{text-align:center;padding:24px;background:#1d1230;border:1px solid #7040a8;border-radius:18px;margin-bottom:25px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 20px;font-weight:800}
.primary{background:linear-gradient(90deg,#9147ff,#c39aff);color:#160b24}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px}
.product{background:linear-gradient(145deg,#241437,#171020);border:1px solid #553278;border-radius:17px;padding:22px;text-align:center}
.product .symbol{font-size:36px}
.product h3{color:#d6baff}
.price{font-size:22px;font-weight:900;color:#c39aff;margin:12px}
.buy{width:100%;background:#9147ff;color:white}
.buy:hover{background:#a968ff}
.hidden{display:none!important}
.support{margin-top:30px;padding:20px;text-align:center;background:#1d1230;border-radius:15px}
a{color:#c39aff;text-decoration:none}
footer{text-align:center;color:#927fa8;padding:25px}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}
.modal-box{background:#20132e;border:1px solid #9147ff;border-radius:18px;padding:24px;width:100%;max-width:420px}
.modal-box h2{color:#c39aff;margin-top:0}
.modal-box input{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #71439c;border-radius:9px;background:#120b1c;color:white;font-family:inherit}
.modal-box button{width:100%;margin-top:8px}
.secondary{background:#40304f;color:white}
#status{margin-top:12px;color:#d5baff;text-align:center}
</style>
</head>
<body>

<header>
<h1>👑 BRAVE TOWN STORE</h1>
<p>متجر بريف تاون الرسمي</p>
</header>

<main class="container">

<section class="welcome">
<h2>منور في متجر BRAVE TOWN</h2>
<p>أهلاً بك في متجرنا الرسمي</p>
<button class="primary" onclick="showProducts()">استعرض المنتجات</button>
</section>

<section id="products" class="hidden">
<h2 style="text-align:center;color:#c39aff">المنتجات المتوفرة</h2>
<div class="products" id="productList"></div>
</section>

<section class="support">
<h3 style="color:#c39aff">الدعم الفني</h3>
<p>حساب الدعم الرسمي</p>
<strong>.os1.</strong>
<p><a href="https://discord.gg/bt-1" target="_blank">دخول سيرفر الديسكورد</a></p>
</section>
</main>

<footer>جميع الحقوق محفوظة © BRAVE TOWN</footer>

<div id="orderModal" class="modal hidden">
<div class="modal-box">
<h2>تأكيد الطلب</h2>
<p id="selectedProduct"></p>
<label for="discordUser">يوزر حسابك في Discord</label>
<input id="discordUser" placeholder="مثال: username" maxlength="80">
<button class="primary" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
<button class="secondary" onclick="closeModal()">إلغاء</button>
<div id="status"></div>
</div>
</div>

<script>
const products=[
{name:"تفعيل فوري",price:2.50,icon:"⚡"},
{name:"رتبة VIP",price:5,icon:"👑"},
{name:"سلاح خفيف",price:2.50,icon:"🔹"},
{name:"سلاح ثقيل",price:7.50,icon:"🔰"},
{name:"مقر عصابة",price:20,icon:"🏢"},
{name:"فتح قطاع عسكري",price:17,icon:"🛡️"}
];

let currentProduct=null;

function showProducts(){
document.getElementById("products").classList.remove("hidden");
document.getElementById("products").scrollIntoView({behavior:"smooth"});
}

function renderProducts(){
const list=document.getElementById("productList");
list.innerHTML="";
products.forEach((p,i)=>{
const card=document.createElement("article");
card.className="product";
const icon=document.createElement("div");
icon.className="symbol";
icon.textContent=p.icon;
const name=document.createElement("h3");
name.textContent=p.name;
const price=document.createElement("div");
price.className="price";
price.textContent=p.price.toFixed(2)+" ﷼";
const btn=document.createElement("button");
btn.className="buy";
btn.textContent="اطلب الآن";
btn.onclick=()=>openOrder(i);
card.append(icon,name,price,btn);
list.appendChild(card);
});
}

function openOrder(index){
currentProduct=products[index];
document.getElementById("selectedProduct").textContent=
"المنتج: "+currentProduct.name+" | السعر: "+currentProduct.price.toFixed(2)+" ريال";
document.getElementById("discordUser").value="";
document.getElementById("status").textContent="";
document.getElementById("orderModal").classList.remove("hidden");
}

function closeModal(){
document.getElementById("orderModal").classList.add("hidden");
}

async function submitOrder(){
const username=document.getElementById("discordUser").value.trim();
const status=document.getElementById("status");

if(!currentProduct)return;
if(!username){
status.textContent="يرجى كتابة يوزر الديسكورد";
return;
}
if(username.length<2){
status.textContent="اليوزر غير صحيح";
return;
}

const buttons=document.querySelectorAll(".modal-box button");
buttons.forEach(b=>b.disabled=true);
status.textContent="جارٍ إرسال الطلب...";

try{
const response=await fetch("/api/order",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
product:currentProduct.name,
discordUsername:username
})
});
const result=await response.json();

if(!response.ok)throw new Error(result.error||"تعذر إرسال الطلب");

status.textContent="تم إرسال طلبك بنجاح 👑";
document.getElementById("discordUser").value="";
setTimeout(closeModal,1800);
}catch(error){
status.textContent=error.message||"حدث خطأ، حاول مرة أخرى";
}finally{
buttons.forEach(b=>b.disabled=false);
}
}

renderProducts();
</script>
</body>
</html>
